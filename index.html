<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataMatch Pro - ระบบชนข้อมูลอัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        sidebar: '#151923',
                        sidebarHover: '#1f2533',
                        sidebarActive: '#262d3d',
                        brandYellow: '#f59e0b',
                        bgLight: '#f4f6f8',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f4f6f8; margin: 0; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
const GAS_URL = "https://script.google.com/macros/s/AKfycbxfTQgd4er49wl7qn7CpRu5y1ccSe6ooWjTDzkUinl7l4HWPOXpUn3xoENJAepeb5U6/exec";

const fetchHistoryFromCloud = async () => {
    try {
        const response = await fetch(`${GAS_URL}?action=getHistory`);
        const data = await response.json();
        if (Array.isArray(data)) {
            setHistoryItems(data);
        }
    } catch (err) {
        console.error("Failed to load history:", err);
    }
};

useEffect(() => {
    fetchHistoryFromCloud(); // โหลดประวัติจาก Google Sheets ทันทีที่เปิดเว็บ
    
    const timer = setInterval(() => {
        const now = new Date();
        setCurrentTime(now);
        // ... (ระบบนับถอยหลังหมดอายุ 24 ชม. คงเดิม)
    }, 1000);
    return () => clearInterval(timer);
}, []);

            const parseLocalDate = (dateStr) => {
                if (!dateStr) return new Date();
                const [datePart, timePart] = dateStr.split(' ');
                const [y, m, d] = datePart.split('-').map(Number);
                const [h, min, s] = timePart.split(':').map(Number);
                return new Date(y, m - 1, d, h, min, s);
            };

            const [activeMenu, setActiveMenu] = useState('home');
            const [fileAll, setFileAll] = useState({ name: '', headers: [], rows: [], originalWs: null });
            const [fileR05, setFileR05] = useState({ name: '', headers: [], rows: [], originalWs: null });
            const [keyColsAll, setKeyColsAll] = useState([]);
            const [keyColsR05, setKeyColsR05] = useState([]);
            const [results, setResults] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [showDuplicateModal, setShowDuplicateModal] = useState(false);
            const [resetKey, setResetKey] = useState(0);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [historyItems, setHistoryItems] = useState([]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);

                    setHistoryItems(prevItems =>
                        prevItems.map(item => {
                            if (item.status === 'expired' || item.status === 'error') return item;
                            const createdDate = parseLocalDate(item.date);
                            const expiryDate = new Date(createdDate.getTime() + 24 * 60 * 60 * 1000);
                            
                            if (now >= expiryDate) {
                                if (item.driveFileId) deleteFileFromGoogleDrive(item.driveFileId);
                                return { ...item, status: 'expired', driveFileId: '' };
                            }
                            return item;
                        })
                    );
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // ฟังก์ชันสร้าง Workbook จาก originalWs และอุ้มสูตร/รูปภาพมาด้วย 100% (ไม่ให้เป็น 0)
            const buildMatchedWorkbook = (matchedRows) => {
                if (!fileAll.originalWs) return null;
                const originalWs = fileAll.originalWs;
                const range = XLSX.utils.decode_range(originalWs['!ref']);
                const newWs = {};
                let newRowIdx = 0;

                const copyRow = (sourceRowIdx, destRowIdx) => {
                    for (let C = range.s.c; C <= range.e.c; C++) {
                        const cellAddress = XLSX.utils.encode_cell({ r: sourceRowIdx, c: C });
                        const cell = originalWs[cellAddress];
                        if (cell) {
                            const newCellAddress = XLSX.utils.encode_cell({ r: destRowIdx, c: C });
                            const copiedCell = JSON.parse(JSON.stringify(cell));
                            
                            // หากเป็นเซลล์สูตร (เช่น =IMAGE) ให้เคลียร์ค่า v ออก เพื่อบังคับให้ Excel รันสูตรใหม่และไม่แสดงค่า 0 ค้างไว้
                            if (copiedCell.f) {
                                delete copiedCell.v;
                            }
                            
                            newWs[newCellAddress] = copiedCell;
                        }
                    }
                };

                // คัดลอก Header (แถวแรก)
                copyRow(0, newRowIdx++);
                
                // คัดลอกแถวที่ Match โดยอิงจาก _originalRowIdx
                matchedRows.forEach(row => {
                    if (row._originalRowIdx !== undefined) {
                        copyRow(row._originalRowIdx, newRowIdx++);
                    }
                });

                newWs['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: newRowIdx - 1, c: range.e.c } });
                const newWb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(newWb, newWs, "Matched_Result");
                return newWb;
            };

            const uploadToGoogleDrive = (fileName, matchedRows, onProgress) => {
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxfTQgd4er49wl7qn7CpRu5y1ccSe6ooWjTDzkUinl7l4HWPOXpUn3xoENJAepeb5U6/exec";

    return new Promise((resolve) => {
        try {
            // ใช้ฟังก์ชันสร้าง Workbook ตัวเดียวกัน เพื่อรักษาสูตรและรูปภาพไว้ ไม่ให้กลายเป็น 0 บนคลาวด์
            const wb = buildMatchedWorkbook(matchedRows);
            if (!wb) {
                resolve("error_file_id");
                return;
            }

            const base64Data = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

            const payload = {
                filename: fileName || "M-Flow_Report.xlsx",
                mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                base64Data: base64Data
            };

            const xhr = new XMLHttpRequest();
            xhr.open('POST', GAS_URL, true);
            xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');

            // ดักจับเปอร์เซ็นต์การอัปโหลดไฟล์ขึ้น Google Drive แบบเรียลไทม์ (ช่วง 50% - 100%)
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable && onProgress) {
                    const percentUploaded = Math.round((event.loaded / event.total) * 50);
                    onProgress(50 + percentUploaded);
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    try {
                        const result = JSON.parse(xhr.responseText);
                        resolve(result.status === "success" ? result.fileId : "error_file_id");
                    } catch (e) {
                        resolve("error_file_id");
                    }
                } else {
                    resolve("error_file_id");
                }
            };

            xhr.onerror = () => {
                resolve("error_file_id");
            };

            xhr.send(JSON.stringify(payload));

        } catch (error) {
            console.error("Upload error:", error);
            resolve("error_file_id");
        }
    });
};

            const deleteFileFromGoogleDrive = async (fileId) => {
                if (!fileId) return;
                const GAS_URL = "https://script.google.com/macros/s/AKfycbxfTQgd4er49wl7qn7CpRu5y1ccSe6ooWjTDzkUinl7l4HWPOXpUn3xoENJAepeb5U6/exec";
                try {
                    await fetch(`${GAS_URL}?action=delete&fileId=${fileId}`);
                } catch (err) {
                    console.error("Failed to delete file from cloud:", err);
                }
            };

            const handleDownloadHistory = (item) => {
                if (item.status === 'expired' || item.status === 'error' || !item.driveFileId) {
                    alert("ไม่สามารถดาวน์โหลดได้ เนื่องจากไฟล์หมดอายุ เกิดข้อผิดพลาด หรือไม่พบข้อมูลตรงกัน");
                    return;
                }
                alert(`กำลังดาวน์โหลดไฟล์ผลลัพธ์จาก Google Drive Cloud (ID: ${item.driveFileId})...`);
            };

            const handleDeleteHistory = async (id) => {
    const item = historyItems.find(i => i.id === id);
    if (item) {
        await fetch(`${GAS_URL}?action=delete&fileId=${item.driveFileId || ''}&id=${id}`);
    }
    setHistoryItems(prev => prev.filter(i => i.id !== id));
};

            const formatTimeRemaining = (dateStr) => {
                const createdDate = parseLocalDate(dateStr);
                const expiryDate = new Date(createdDate.getTime() + 24 * 60 * 60 * 1000);
                const diff = expiryDate - currentTime;

                if (diff <= 0) return 'หมดอายุ';

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                if (hours > 0) return `${hours} ชม. ${minutes} น.`;
                else if (minutes > 0) return `${minutes} น. ${seconds} วิ.`;
                else return `${seconds} วิ.`;
            };

            const handleReset = () => {
                setFileAll({ name: '', headers: [], rows: [], originalWs: null });
                setFileR05({ name: '', headers: [], rows: [], originalWs: null });
                setKeyColsAll([]);
                setKeyColsR05([]);
                setResults(null);
                setIsProcessing(false);
                setShowDuplicateModal(false);
                setResetKey(prev => prev + 1);
            };

            const handleFileUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileExtension = file.name.split('.').pop().toLowerCase();

                if (fileExtension === 'csv') {
                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            const data = { name: file.name, headers: results.meta.fields, rows: results.data, originalWs: null };
                            if (type === 'ALL') setFileAll(data);
                            else setFileR05(data);
                        }
                    });
                } else if (fileExtension === 'xlsx' || fileExtension === 'xls') {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellFormula: true });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const aoa = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        const rawHeaders = aoa.length > 0 ? aoa[0] : [];
                        const headers = rawHeaders.map((h, i) => (h === undefined || h === "") ? `__EMPTY_${i}` : h);
                        
                        const rows = [];
                        for (let i = 1; i < aoa.length; i++) {
                            const rowData = aoa[i];
                            if (!rowData) continue; 
                            
                            const rowObj = {};
                            let isEmpty = true;
                            headers.forEach((h, colIdx) => {
                                rowObj[h] = rowData[colIdx] !== undefined ? rowData[colIdx] : "";
                                if (rowObj[h] !== "") isEmpty = false;
                            });
                            
                            if (!isEmpty) {
                                rowObj._originalRowIdx = i;
                                rows.push(rowObj);
                            }
                        }

                        const processedData = {
                            name: file.name,
                            headers: headers,
                            rows: rows,
                            originalWs: worksheet 
                        };

                        if (type === 'ALL') setFileAll(processedData);
                        else setFileR05(processedData);
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    alert("รองรับเฉพาะไฟล์ .csv หรือ .xlsx / .xls เท่านั้น");
                }
            };

            const processValue = (val, colName, isAllFile) => {
                let s = String(val || '').trim();
                if (isAllFile && colName === "เวลา") s = s.replace(/\.\d{3}$/, '');
                if (colName === "เวลา") {
                    const parts = s.split(':');
                    if (parts.length > 0 && parts[0].length === 1) {
                        parts[0] = '0' + parts[0];
                        s = parts.join(':');
                    }
                }
                return s;
            };

            const generateKey = (row, cols, isAllFile) => {
                return cols.map(col => processValue(row[col], col, isAllFile)).join('|');
            };

            const runMatching = async () => {
    if (keyColsAll.length === 0 || keyColsR05.length === 0) {
        alert("กรุณาเลือกคอลัมน์สำหรับสร้าง Key ให้ครบถ้วน");
        return;
    }
    setIsProcessing(true);
    setActiveMenu('history');

    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    const nowStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

    const newHistoryId = historyItems.length > 0 ? Math.max(...historyItems.map(i => i.id)) + 1 : 1;
    const initialHistoryItem = {
        id: newHistoryId,
        type: 'ชนข้อมูล (Match)',
        condition: 'All + R05 (ALPR)',
        date: nowStr,
        status: 'processing',
        progress: 10,
        records: 0,
        driveFileId: ''
    };

    setHistoryItems(prev => [initialHistoryItem, ...prev]);

    // บันทึกสถานะเริ่มต้นลง Cloud
    try {
        await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "saveHistory", ...initialHistoryItem })
        });
    } catch (err) {
        console.error("Failed to save initial history:", err);
    }

    setTimeout(async () => {
        try {
            // อัปเดตสถานะกำลังคำนวณ (30%)
            setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? { ...item, progress: 30 } : item));

            const filteredR05 = fileR05.rows.filter(r => String(r["ประเภทระบบ"]) === "ALPR");
            const mapR05 = new Map();
            filteredR05.forEach(row => {
                const key = generateKey(row, keyColsR05, false);
                mapR05.set(key, true);
            });

            // อัปเดตสถานะคำนวณใกล้เสร็จ (50%)
            setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? { ...item, progress: 50 } : item));

            const matchedRows = [];
            const keyCounts = {};

            fileAll.rows.forEach(row => {
                const key = generateKey(row, keyColsAll, true);
                if (mapR05.has(key)) {
                    matchedRows.push(row);
                    keyCounts[key] = (keyCounts[key] || 0) + 1;
                }
            });

            const duplicateDetails = Object.keys(keyCounts)
                .filter(k => keyCounts[k] > 1)
                .map(k => ({ key: k, count: keyCounts[k] }))
                .sort((a, b) => b.count - a.count);

            setResults({
                totalAll: fileAll.rows.length,
                totalR05: fileR05.rows.length,
                totalR05ALPR: filteredR05.length,
                matchedCount: matchedRows.length,
                duplicateDetails: duplicateDetails,
                data: matchedRows 
            });
            setIsProcessing(false);

            if (matchedRows.length === 0) {
                setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? { ...item, status: 'error', progress: 100, records: 0 } : item));
                await fetch(`${GAS_URL}?action=updateHistory&id=${newHistoryId}&status=error&records=0`);
            } else {
                // เรียกใช้อัปโหลด พร้อมส่ง callback (onProgress) เพื่อให้หลอดเปอร์เซ็นต์วิ่งตามจริง (50% - 100%)
                const fileId = await uploadToGoogleDrive("Matched_Result.xlsx", matchedRows, (currentProgress) => {
                    setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? {
                        ...item,
                        progress: currentProgress,
                        condition: `All + R05 (กำลังอัปโหลด ${currentProgress}%)`
                    } : item));
                });
                
                // อัปเดตสถานะเมื่อเสร็จสมบูรณ์ 100%
                setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? {
                    ...item,
                    status: 'done',
                    progress: 100,
                    condition: 'All + R05 (ALPR)',
                    records: matchedRows.length,
                    driveFileId: fileId
                } : item));

                await fetch(`${GAS_URL}?action=updateHistory&id=${newHistoryId}&status=done&records=${matchedRows.length}&driveFileId=${fileId}`);
            }
        } catch (error) {
            console.error("Processing error:", error);
            setIsProcessing(false);
            setHistoryItems(prev => prev.map(item => item.id === newHistoryId ? { ...item, status: 'error', progress: 100 } : item));
            
            try {
                await fetch(`${GAS_URL}?action=updateHistory&id=${newHistoryId}&status=error&records=0`);
            } catch (e) {}
            
            alert("เกิดข้อผิดพลาดในการประมวลผลหรืออัปโหลดไฟล์: " + error.message);
        }
    }, 500);
};

            const downloadResult = () => {
                if (!results || results.data.length === 0) return;
                const wb = buildMatchedWorkbook(results.data);
                if (wb) {
                    XLSX.writeFile(wb, "Matched_Result.xlsx");
                } else {
                    alert("ไม่พบไฟล์ต้นฉบับสำหรับการคัดลอกเซลล์");
                }
            };

            const NavItem = ({ icon, label, id }) => (
                <button 
                    onClick={() => setActiveMenu(id)}
                    className={`w-full flex items-center gap-3 px-6 py-3 text-sm transition-all duration-200 border-l-4 ${
                        activeMenu === id 
                        ? 'bg-sidebarActive border-brandYellow text-white font-medium' 
                        : 'border-transparent text-slate-400 hover:bg-sidebarHover hover:text-slate-200'
                    }`}
                >
                    <i className={`fa-solid ${icon} w-5 text-center ${activeMenu === id ? 'text-brandYellow' : ''}`}></i>
                    <span>{label}</span>
                </button>
            );

            const renderHomeView = () => (
                <div className="animate-fade-in space-y-6">
                    <div>
                        <p className="text-brandYellow text-sm font-semibold mb-1">ศูนย์ควบคุมการทำงาน</p>
                        <h1 className="text-2xl font-bold text-slate-800">สวัสดี, ผู้ใช้งาน</h1>
                        <p className="text-slate-500 text-sm mt-2">
                            ระบบจัดการข้อมูลและออกรายงาน — เลือกเมนูเพื่อเริ่มต้นการทำงาน หรือตรวจสอบสถานะรายงานของคุณ
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8 max-w-3xl">
                        <div 
                            onClick={() => setActiveMenu('match')}
                            className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-brandYellow/50 transition-all cursor-pointer group"
                        >
                            <div className="w-10 h-10 bg-orange-50 text-brandYellow rounded-lg flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i className="fa-regular fa-file-lines text-lg"></i>
                            </div>
                            <h3 className="font-semibold text-slate-800 mb-2">ชนข้อมูล (Match)</h3>
                            <p className="text-sm text-slate-500">
                                ดึงข้อมูลไฟล์ All และ R05 — ตั้งค่า Key เพื่อค้นหา และส่งออกข้อมูลที่ตรงกันเป็นไฟล์ Excel
                            </p>
                        </div>
                        <div 
                            onClick={() => setActiveMenu('history')}
                            className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-brandYellow/50 transition-all cursor-pointer group"
                        >
                            <div className="w-10 h-10 bg-orange-50 text-brandYellow rounded-lg flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                <i className="fa-solid fa-list-check text-lg"></i>
                            </div>
                            <h3 className="font-semibold text-slate-800 mb-2">ประวัติการทำงาน</h3>
                            <p className="text-sm text-slate-500">
                                ติดตามสถานะคิวงาน และดาวน์โหลดไฟล์ที่ดำเนินการเสร็จแล้วย้อนหลัง
                            </p>
                        </div>
                    </div>
                </div>
            );

            const renderMatchView = () => (
                <div className="animate-fade-in space-y-6 max-w-5xl">
                    <div className="flex justify-between items-end">
                        <div>
                            <p className="text-brandYellow text-sm font-semibold mb-1">ปฏิบัติการ</p>
                            <h1 className="text-2xl font-bold text-slate-800">ชนข้อมูลรายการผ่านทาง</h1>
                            <p className="text-slate-500 text-sm mt-1">อัปโหลดไฟล์ ตั้งค่าเงื่อนไขการค้นหา แล้วกด "ค้นหาข้อมูล" เพื่อดูตัวอย่างหรือส่งออก</p>
                        </div>
                        {(fileAll.name || fileR05.name || results) && (
                            <button onClick={handleReset} className="text-slate-500 hover:text-red-500 text-sm font-medium transition flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm">
                                <i className="fa-solid fa-rotate-right"></i> ล้างข้อมูล
                            </button>
                        )}
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                            <h2 className="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                                <span className="bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span> 
                                อัปโหลดไฟล์ข้อมูลต้นทาง
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1.5">ไฟล์ All (ฐานข้อมูลหลัก)</label>
                                    <div className="relative">
                                        <input key={`file-all-${resetKey}`} type="file" onChange={(e) => handleFileUpload(e, 'ALL')} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 file:font-medium file:cursor-pointer border border-slate-200 rounded-md bg-white"/>
                                        {fileAll.name && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"><i className="fa-solid fa-check-circle"></i> อัปโหลดแล้ว</div>}
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-1 truncate pr-2">{fileAll.name || 'รองรับ .csv, .xlsx'}</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1.5">ไฟล์ R05 (ไฟล์ที่ต้องการค้นหา, กรอง ALPR)</label>
                                    <div className="relative">
                                        <input key={`file-r05-${resetKey}`} type="file" onChange={(e) => handleFileUpload(e, 'R05')} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 file:font-medium file:cursor-pointer border border-slate-200 rounded-md bg-white"/>
                                        {fileR05.name && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-emerald-500 text-xs"><i className="fa-solid fa-check-circle"></i> อัปโหลดแล้ว</div>}
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-1 truncate pr-2">{fileR05.name || 'รองรับ .csv, .xlsx'}</p>
                                </div>
                            </div>
                        </div>

                        {fileAll.headers.length > 0 && fileR05.headers.length > 0 && (
                            <div className="p-6 border-b border-slate-100">
                                <h2 className="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                                    <span className="bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span> 
                                    ตั้งค่าเงื่อนไขการค้นหา (Key Mapping)
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                        <label className="block text-xs font-medium text-slate-600 mb-2">คอลัมน์จากไฟล์ All</label>
                                        <select 
                                            className="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-1 focus:ring-brandYellow focus:border-brandYellow outline-none bg-white" 
                                            onChange={(e) => e.target.value && setKeyColsAll([...keyColsAll, e.target.value])}
                                            value=""
                                        >
                                            <option value="" disabled>-- เลือกคอลัมน์เพื่อเพิ่ม --</option>
                                            {fileAll.headers.map((h, i) => <option key={i} value={h}>{h}</option>)}
                                        </select>
                                        <div className="flex flex-wrap gap-2 mt-3 min-h-[32px]">
                                            {keyColsAll.length === 0 && <span className="text-xs text-slate-400 italic">ยังไม่ได้เลือกคอลัมน์</span>}
                                            {keyColsAll.map((col, idx) => (
                                                <span key={idx} className="bg-white border border-slate-300 shadow-sm px-2.5 py-1 rounded-md text-xs flex items-center gap-2 text-slate-700">
                                                    {col} 
                                                    <button onClick={() => setKeyColsAll(keyColsAll.filter((_,i)=>i!==idx))} className="text-slate-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                        <label className="block text-xs font-medium text-slate-600 mb-2">คอลัมน์จากไฟล์ R05</label>
                                        <select 
                                            className="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-1 focus:ring-brandYellow focus:border-brandYellow outline-none bg-white" 
                                            onChange={(e) => e.target.value && setKeyColsR05([...keyColsR05, e.target.value])}
                                            value=""
                                        >
                                            <option value="" disabled>-- เลือกคอลัมน์เพื่อเพิ่ม --</option>
                                            {fileR05.headers.map((h, i) => <option key={i} value={h}>{h}</option>)}
                                        </select>
                                        <div className="flex flex-wrap gap-2 mt-3 min-h-[32px]">
                                            {keyColsR05.length === 0 && <span className="text-xs text-slate-400 italic">ยังไม่ได้เลือกคอลัมน์</span>}
                                            {keyColsR05.map((col, idx) => (
                                                <span key={idx} className="bg-white border border-slate-300 shadow-sm px-2.5 py-1 rounded-md text-xs flex items-center gap-2 text-slate-700">
                                                    {col} 
                                                    <button onClick={() => setKeyColsR05(keyColsR05.filter((_,i)=>i!==idx))} className="text-slate-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="p-6 bg-slate-50/30 flex items-center gap-3">
                            <button 
                                onClick={runMatching}
                                disabled={isProcessing || keyColsAll.length === 0 || keyColsR05.length === 0}
                                className={`px-6 py-2.5 rounded-md font-medium text-sm transition-all flex items-center gap-2 ${
                                    isProcessing || keyColsAll.length === 0 || keyColsR05.length === 0
                                    ? 'bg-slate-300 text-slate-500 cursor-not-allowed'
                                    : 'bg-teal-600 hover:bg-teal-700 text-white shadow-sm'
                                }`}
                            >
                                {isProcessing ? <><i className="fa-solid fa-circle-notch fa-spin"></i> กำลังประมวลผล...</> : 'ค้นหาข้อมูล'}
                            </button>

                            {results && (
                                <button 
                                    onClick={downloadResult}
                                    className="px-6 py-2.5 rounded-md font-medium text-sm bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition-all flex items-center gap-2"
                                >
                                    ส่งออก Excel
                                </button>
                            )}
                        </div>
                    </div>

                    {results && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 animate-fade-in mt-6">
                            <h3 className="text-base font-semibold text-slate-800 mb-4 border-b border-slate-100 pb-2">ผลลัพธ์การค้นหา</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="border border-slate-100 rounded-lg p-4 bg-slate-50 text-center">
                                    <p className="text-xs text-slate-500 mb-1">ข้อมูลตั้งต้น (All)</p>
                                    <p className="text-2xl font-bold text-slate-700">{results.totalAll.toLocaleString()}</p>
                                </div>
                                <div className="border border-slate-100 rounded-lg p-4 bg-slate-50 text-center">
                                    <p className="text-xs text-slate-500 mb-1">เงื่อนไข R05 (ALPR)</p>
                                    <p className="text-2xl font-bold text-slate-700">{results.totalR05ALPR.toLocaleString()}</p>
                                </div>
                                <div className="border border-teal-100 rounded-lg p-4 bg-teal-50 text-center">
                                    <p className="text-xs text-teal-600 mb-1 font-medium">พบข้อมูลตรงกัน</p>
                                    <p className="text-2xl font-bold text-teal-700">{results.matchedCount.toLocaleString()}</p>
                                </div>
                                <div className="border border-amber-100 rounded-lg p-4 bg-amber-50 text-center relative group">
                                    <p className="text-xs text-amber-600 mb-1 font-medium">รายการคีย์ซ้ำ</p>
                                    <p className="text-2xl font-bold text-amber-700">{results.duplicateDetails.length.toLocaleString()}</p>
                                    {results.duplicateDetails.length > 0 && (
                                        <button onClick={() => setShowDuplicateModal(true)} className="absolute inset-0 w-full h-full bg-amber-500/90 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-sm font-medium backdrop-blur-sm">
                                            ดูรายละเอียด
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const renderHistoryView = () => (
                <div className="animate-fade-in space-y-6">
                    <div>
                        <p className="text-brandYellow text-sm font-semibold mb-1">คิวงาน</p>
                        <h1 className="text-2xl font-bold text-slate-800">รายงานของฉัน</h1>
                        <p className="text-slate-500 text-sm mt-1">สถานะอัปเดตแบบเรียลไทม์ - ไฟล์ผลลัพธ์จัดเก็บบบน Google Drive Cloud และเก็บรักษาไว้เป็นเวลา 1 วัน</p>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
                                    <tr>
                                        <th className="p-4 w-16 text-center">เลขที่</th>
                                        <th className="p-4">ประเภท</th>
                                        <th className="p-4 min-w-[200px]">เงื่อนไขที่ใช้</th>
                                        <th className="p-4">สร้างเมื่อ</th>
                                        <th className="p-4 text-center">สถานะ</th>
                                        <th className="p-4 text-center">ความคืบหน้า</th>
                                        <th className="p-4 text-center">รายละเอียด</th>
                                        <th className="p-4 text-center">ใช้งานได้อีก</th>
                                        <th className="p-4 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {historyItems.map((row) => (
                                        <tr key={row.id} className="hover:bg-slate-50/50 transition">
                                            <td className="p-4 text-center text-slate-500">{row.id}</td>
                                            <td className="p-4 text-slate-700 font-medium">{row.type}</td>
                                            <td className="p-4">
                                                <div className="text-slate-700 text-xs bg-slate-100 px-2.5 py-1 rounded-md inline-block">{row.condition}</div>
                                            </td>
                                            <td className="p-4 text-slate-500 text-xs">{row.date}</td>
                                            <td className="p-4 text-center">
                                                {row.status === 'done' && (
                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 border border-emerald-200">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> เสร็จแล้ว
                                                    </span>
                                                )}
                                                {row.status === 'processing' && (
                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-700 border border-amber-200">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> กำลังคำนวน
                                                    </span>
                                                )}
                                                {row.status === 'error' && (
                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-rose-100 text-rose-700 border border-rose-200">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span> เกิดข้อผิดพลาด
                                                    </span>
                                                )}
                                                {row.status === 'expired' && (
                                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-slate-400"></span> หมดอายุ
                                                    </span>
                                                )}
                                            </td>
                                            <td className="p-4 text-center">
                                                <div className="w-24 bg-slate-200 rounded-full h-2 mx-auto overflow-hidden">
                                                    <div 
                                                        className={`h-2 rounded-full ${
                                                            row.status === 'processing' ? 'bg-amber-500 animate-pulse' :
                                                            row.status === 'error' ? 'bg-rose-500' :
                                                            'bg-emerald-500'
                                                        }`} 
                                                        style={{ width: `${row.progress}%` }}
                                                    ></div>
                                                </div>
                                            </td>
                                            <td className="p-4 text-center text-slate-600 text-xs font-semibold">
                                                {row.records.toLocaleString()} รายการ
                                            </td>
                                            <td className="p-4 text-center text-xs font-medium">
                                                {row.status === 'done' ? (
                                                    <span className="text-teal-600">{formatTimeRemaining(row.date)}</span>
                                                ) : row.status === 'processing' ? (
                                                    <span className="text-amber-600">กำลังประมวลผล...</span>
                                                ) : (
                                                    <span className="text-rose-500">-</span>
                                                )}
                                            </td>
                                            <td className="p-4 text-center">
                                                <div className="flex flex-col gap-1.5 items-center">
                                                    <button 
                                                        onClick={() => handleDownloadHistory(row)}
                                                        disabled={row.status === 'expired' || row.status === 'processing' || row.status === 'error'}
                                                        className={`px-3 py-1 rounded text-xs font-medium transition shadow-sm ${
                                                            row.status === 'expired' || row.status === 'processing' || row.status === 'error'
                                                            ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                                            : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        ดาวน์โหลด
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteHistory(row.id)}
                                                        className="px-3 py-1 rounded text-xs font-medium bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 transition shadow-sm"
                                                    >
                                                        ลบ
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-bgLight">
                    <div className="w-64 bg-sidebar text-slate-300 flex flex-col shadow-2xl z-20 shrink-0">
                        <div className="h-20 px-6 flex items-center gap-3 border-b border-slate-700/50 select-none">
                            <div className="w-9 h-9 bg-brandYellow text-sidebar rounded-md flex items-center justify-center font-bold text-xl shadow-lg shadow-brandYellow/20 transform rotate-3 hover:rotate-0 transition-transform">
                                <i className="fa-solid fa-layer-group"></i>
                            </div>
                            <div>
                                <div className="font-bold text-white tracking-wide leading-tight">SPF</div>
                                <div className="text-xs text-slate-400">รายงาน / ชนข้อมูล</div>
                            </div>
                        </div>
                        
                        <div className="flex-1 py-6 flex flex-col gap-1 overflow-y-auto custom-scrollbar">
                            <NavItem icon="fa-house" label="หน้าหลัก" id="home" />
                            <NavItem icon="fa-file-lines" label="ออกรายงาน (ชนข้อมูล)" id="match" />
                            <NavItem icon="fa-bars-staggered" label="รายงานของฉัน" id="history" />
                        </div>
                        
                        <div className="p-4 border-t border-slate-700/50 bg-[#11141c]">
                            <div className="bg-[#1b212f] rounded-lg p-3 flex items-center justify-between border border-slate-700/50">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 bg-brandYellow text-sidebar rounded flex items-center justify-center font-bold text-sm">
                                        O
                                    </div>
                                    <div className="text-xs">
                                        <div className="text-slate-400">ผู้ใช้งาน</div>
                                    </div>
                                </div>
                                <button className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 rounded transition">
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-8 md:p-10">
                            {activeMenu === 'home' && renderHomeView()}
                            {activeMenu === 'match' && renderMatchView()}
                            {activeMenu === 'history' && renderHistoryView()}
                        </div>
                    </div>

                    {showDuplicateModal && results && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden animate-fade-in">
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation text-amber-500"></i> รายละเอียดคีย์ที่พบซ้ำ
                                    </h3>
                                    <button onClick={() => setShowDuplicateModal(false)} className="text-slate-400 hover:text-slate-700 text-lg w-8 h-8 flex items-center justify-center rounded-md hover:bg-slate-200 transition">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-auto flex-1 custom-scrollbar">
                                    <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg mb-4 text-sm">
                                        พบข้อมูลคีย์จากไฟล์ R05 ที่ไปตรงกับไฟล์ All มากกว่า 1 รายการต่อคีย์
                                    </div>
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600">
                                                <th className="p-3 border-b font-medium rounded-tl-lg">คีย์ที่ใช้ชน (Key)</th>
                                                <th className="p-3 border-b font-medium w-32 text-center rounded-tr-lg">จำนวนที่พบ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {results.duplicateDetails.map((dup, i) => (
                                                <tr key={i} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono text-slate-600 text-xs">{dup.key}</td>
                                                    <td className="p-3 text-center">
                                                        <span className="bg-rose-100 text-rose-700 px-2 py-0.5 rounded text-xs font-semibold">
                                                            {dup.count}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
